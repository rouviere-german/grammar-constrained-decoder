[project]
name = "grammar-constrained-decoder"
version = "0.1.0"
description = "Compiles a JSON Schema subset into minimized DFAs with an exact token-transition index, so a locally trained n-gram LM emits schema-valid JSON; an independent Brzozowski-derivative oracle checks every token mask."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rouviere German" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # --- core (every repo) ---
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "prometheus-client>=0.21",
    # --- ml kit + constrained decoding ---
    "numpy>=2.0",
    "tokenizers>=0.20",
    "jsonschema>=4.23",
    # --- serving ---
    "sse-starlette>=2.1",
    "pyjwt>=2.10",
]

[project.scripts]
grammar-constrained-decoder = "grammar_constrained_decoder.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "httpx2>=0.1",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-jsonschema>=4.23",
    "hypothesis-jsonschema>=0.23",
    "bandit[toml]>=1.8",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

# Baseline metadata consumed by scripts/check_baseline.py.
# kind: "template" (both kits), "agentic" or "ml".
[tool.portfolio]
kind = "ml"
package = "grammar_constrained_decoder"

# pip-audit has no native config file; tasks.py and CI read this list.
# Every entry needs a justification and a review date.
[tool.portfolio.audit]
ignore_vulns = []

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "bench"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "N", "SIM", "C4", "RUF", "PT", "PL", "TRY", "BLE", "DTZ", "T20",
]
ignore = [
    "PLR0913",  # explicit keyword-heavy constructors are fine
    "PLR2004",  # magic numbers in tests and thresholds
    "TRY003",   # messages in exception constructors are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "PLR2004", "PLC0415", "S603"]
"scripts/**" = ["T201"]
"bench/**" = ["T201", "S311"]
"tasks.py" = ["T201", "S603", "S607"]
"src/grammar_constrained_decoder/cli.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts", "bench", "tasks.py"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
# hypothesis-jsonschema ships no type information (dev-only, used by tests).
module = ["hypothesis_jsonschema", "hypothesis_jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "unit: fast, isolated tests with no I/O beyond tmp_path",
    "integration: tests that wire several components (app, files, CLI) together",
]
filterwarnings = ["error::DeprecationWarning:grammar_constrained_decoder.*"]

[tool.coverage.run]
source = ["grammar_constrained_decoder"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = []
